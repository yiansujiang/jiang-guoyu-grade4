<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窗口邊的臺灣欒樹｜互動闖關</title>
<style>
  /* ============ 沉靜自然色系（低感官刺激、高對比、ASD 友善） ============ */
  :root{
    --bg:#f4f1e8;          /* 溫潤紙色底，避免純白刺眼 */
    --bg-top:#eef2e6;
    --panel:#fffdf8;       /* 卡面 */
    --panel-soft:#f7f4ea;
    --ink:#33352e;         /* 柔和近黑，非純黑 */
    --muted:#6f7266;
    --line:#e0dccb;
    --accent:#3f9d7c;      /* 主要行動色：沉靜綠 */
    --accent-dark:#2f7d62;
    --accent-soft:#e2f0e8;
    --star:#e8a13c;        /* 星星金 */
    --ok:#4a9e6d;
    --ok-soft:#e5f3ea;
    --retry:#d98a2b;       /* 再試一次：暖橘，非懲罰性紅 */
    --retry-soft:#fbeeda;
    --spring:#7bc47f; --summer:#2f8f5b; --autumn:#e0a23a; --winter:#89aec2;
    --radius:20px;
    --shadow:0 6px 20px rgba(60,70,50,.10);
    --fs:1;   /* 字級倍率，由按鈕調整 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--bg-top),var(--bg));
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
    font-size:calc(19px * var(--fs));
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    letter-spacing:.01em;
  }
  /* ============ 頂部固定列：品牌、進度、工具 ============ */
  header.topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,253,248,.92);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--line);
    padding:10px clamp(12px,3vw,28px);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--accent-dark);font-size:.82em;white-space:nowrap;}
  .brand .badge{width:30px;height:30px;flex:none;}
  .topbar .title{font-weight:800;font-size:.86em;color:var(--ink);flex:1;min-width:140px;}
  /* 全域四關進度星 */
  .prog{display:flex;gap:6px;align-items:center;}
  .prog .dot{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.68em;font-weight:800;
    background:var(--panel-soft);color:var(--muted);
  }
  .prog .dot.done{background:var(--star);border-color:var(--star);color:#fff;}
  .prog .dot.current{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
  .tools{display:flex;gap:8px;align-items:center;}
  .tool-btn{
    border:2px solid var(--line);background:var(--panel);border-radius:12px;
    padding:6px 10px;font-size:.72em;cursor:pointer;color:var(--ink);font-weight:700;
    font-family:inherit;line-height:1;display:flex;align-items:center;gap:5px;
  }
  .tool-btn:hover{border-color:var(--accent);}
  .tool-btn.off{opacity:.5;text-decoration:line-through;}
  /* ============ 主容器 ============ */
  main{max-width:820px;margin:0 auto;padding:clamp(16px,3vw,30px) clamp(14px,3vw,22px) 60px;}
  .card{
    background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:clamp(20px,4vw,36px);
  }
  h1,h2,h3{line-height:1.5;margin:0 0 .5em;}
  /* ============ 首頁：學習地圖關卡（視覺化學習流程 = 視覺時間表） ============ */
  .home-hero{text-align:center;margin-bottom:26px;}
  .home-hero .tree-emoji{font-size:2.6em;line-height:1;}
  .home-hero h1{font-size:1.5em;color:var(--accent-dark);margin-top:.2em;}
  .home-hero .author{color:var(--muted);font-size:.9em;}
  .home-hero .intro{
    background:var(--accent-soft);border-radius:16px;padding:14px 18px;margin:16px auto 0;
    max-width:600px;text-align:left;font-size:.92em;border:1px solid #cfe6d9;
  }
  .roadmap{display:flex;flex-direction:column;gap:0;margin-top:10px;}
  .level-row{display:flex;align-items:stretch;gap:14px;}
  .level-rail{display:flex;flex-direction:column;align-items:center;width:46px;flex:none;}
  .level-rail .num{
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:1.05em;border:3px solid var(--line);background:var(--panel);color:var(--muted);
  }
  .level-rail .line-v{flex:1;width:4px;background:var(--line);border-radius:2px;min-height:14px;}
  .level-row.done .num{background:var(--star);border-color:var(--star);color:#fff;}
  .level-row.current .num{background:var(--accent);border-color:var(--accent);color:#fff;}
  .level-card{
    flex:1;background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;
    transition:border-color .2s,transform .15s;
  }
  .level-row.current .level-card{border-color:var(--accent);box-shadow:var(--shadow);}
  .level-row.locked .level-card{opacity:.55;background:var(--panel-soft);}
  .level-card .ic{font-size:1.9em;flex:none;}
  .level-card .body{flex:1;}
  .level-card .body b{font-size:1.05em;}
  .level-card .body .sub{color:var(--muted);font-size:.82em;}
  .level-card .status{font-size:.8em;font-weight:800;white-space:nowrap;}
  .level-card .status.ok{color:var(--star);}
  .level-card .status.lock{color:var(--muted);}
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:800;
    padding:14px 26px;font-size:1em;background:var(--accent);color:#fff;
    box-shadow:0 4px 0 var(--accent-dark);transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark);}
  .btn.big{display:block;width:100%;margin-top:8px;font-size:1.15em;padding:18px;}
  .btn.ghost{background:var(--panel);color:var(--accent-dark);border:2px solid var(--accent);box-shadow:none;}
  .btn.ghost:active{transform:translateY(2px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn-row{display:flex;gap:12px;margin-top:22px;align-items:center;flex-wrap:wrap;}
  .btn-row .spacer{flex:1;}
  /* ============ 關卡內：步驟進度 ============ */
  .level-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .level-head .chip{background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.82em;}
  .step-bar{display:flex;gap:6px;margin:14px 0 22px;}
  .step-bar .seg{flex:1;height:9px;border-radius:5px;background:var(--line);}
  .step-bar .seg.on{background:var(--accent);}
  .step-bar .seg.cur{background:var(--star);}
  .step-count{color:var(--muted);font-size:.82em;font-weight:700;margin-bottom:2px;}
  /* ============ 課文閱讀卡 ============ */
  .read-badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.95em;padding:6px 16px;border-radius:999px;margin-bottom:14px;}
  .season-春{background:#e6f4e7;color:#3a7a3f;} .season-夏{background:#e0efe6;color:#256b46;}
  .season-秋{background:#fbf0d9;color:#a9741a;} .season-冬{background:#e7eef3;color:#4c6b7c;}
  .season-none{background:var(--panel-soft);color:var(--muted);}
  .passage{font-size:1.22em;line-height:2.2;letter-spacing:.03em;}
  .term{
    color:var(--accent-dark);font-weight:800;border-bottom:3px dotted var(--accent);
    cursor:pointer;padding:0 2px;border-radius:4px;
  }
  .term:hover{background:var(--accent-soft);}
  .read-tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .hint-line{color:var(--muted);font-size:.82em;margin-top:14px;}
  /* 生詞小視窗 */
  .term-pop{
    margin-top:16px;background:var(--accent-soft);border:2px solid #bfe0d0;border-radius:14px;
    padding:14px 18px;display:none;
  }
  .term-pop.show{display:block;animation:fade .25s;}
  .term-pop .w{font-size:1.2em;font-weight:800;color:var(--accent-dark);}
  /* ============ 語音朗讀鈕 ============ */
  .tts{
    display:inline-flex;align-items:center;gap:7px;border:2px solid var(--accent);
    background:var(--panel);color:var(--accent-dark);border-radius:12px;padding:10px 16px;
    font-weight:800;cursor:pointer;font-family:inherit;font-size:.9em;
  }
  .tts:hover{background:var(--accent-soft);}
  .tts.speaking{background:var(--accent);color:#fff;}
  /* ============ 生字卡 ============ */
  .zi-card{text-align:center;}
  .zi-big{font-size:5.2em;line-height:1.1;font-weight:800;color:var(--ink);
    background:var(--panel-soft);border-radius:20px;padding:10px 0;position:relative;}
  .zi-zhuyin{font-size:1.5em;color:var(--accent-dark);font-weight:800;margin-top:8px;letter-spacing:.1em;}
  .zi-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .zi-meta .m{background:var(--panel-soft);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:.82em;font-weight:700;color:var(--muted);}
  .zi-meta .m b{color:var(--ink);}
  .zi-word{margin-top:16px;font-size:1.15em;}
  .zi-word .hl{color:var(--accent-dark);font-weight:800;}
  /* 筆順動畫（田字格 + HanziWriter） */
  .zi-writer-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;}
  .zi-tian{position:relative;width:204px;height:204px;background:#fff;border:2px solid var(--line);border-radius:14px;box-sizing:border-box;}
  .zi-tian .cross-h{position:absolute;left:6px;right:6px;top:50%;border-top:1px dashed #d8d2c0;z-index:0;}
  .zi-tian .cross-v{position:absolute;top:6px;bottom:6px;left:50%;border-left:1px dashed #d8d2c0;z-index:0;}
  #ziWriter{position:absolute;inset:0;z-index:1;}
  .zi-fallback{font-size:5em;font-weight:800;text-align:center;line-height:200px;color:var(--ink);}
  .zi-quizmsg{min-height:1.3em;color:var(--accent-dark);font-weight:700;font-size:.9em;text-align:center;}
  .zi-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn2{font-family:inherit;cursor:pointer;border:2px solid var(--accent);background:var(--panel);
    color:var(--accent-dark);border-radius:12px;padding:9px 15px;font-weight:800;font-size:.88em;}
  .btn2:hover{background:var(--accent-soft);}
  .btn2.on{background:var(--accent);color:#fff;}
  /* ============ 單選題 ============ */
  .q-text{font-size:1.25em;font-weight:800;line-height:1.7;margin-bottom:6px;}
  .q-options{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .opt{
    text-align:left;font-family:inherit;font-size:1.08em;font-weight:700;cursor:pointer;
    background:var(--panel);border:2.5px solid var(--line);border-radius:16px;padding:16px 20px;
    display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s;color:var(--ink);
  }
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);}
  .opt .key{width:34px;height:34px;flex:none;border-radius:50%;background:var(--panel-soft);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft);}
  .opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff;}
  .opt.wrong{border-color:var(--retry);background:var(--retry-soft);}
  .opt.wrong .key{background:var(--retry);border-color:var(--retry);color:#fff;}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:20px;border-radius:16px;padding:16px 20px;font-weight:700;display:none;font-size:1.02em;}
  .feedback.show{display:block;animation:fade .3s;}
  .feedback.good{background:var(--ok-soft);border:2px solid var(--ok);color:#2f7a4e;}
  .feedback.try{background:var(--retry-soft);border:2px solid var(--retry);color:#a5641a;}
  /* ============ 四季拖曳/配對心智圖 ============ */
  .mindmap{position:relative;margin:10px auto 0;max-width:560px;}
  .mm-center{text-align:center;background:var(--accent-soft);border:2px solid #bfe0d0;border-radius:18px;padding:14px;margin-bottom:16px;font-weight:800;color:var(--accent-dark);font-size:1.05em;}
  .mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .mm-season{border-radius:16px;padding:16px;border:2px solid;background:var(--panel);}
  .mm-season.s春{border-color:var(--spring);} .mm-season.s夏{border-color:var(--summer);}
  .mm-season.s秋{border-color:var(--autumn);} .mm-season.s冬{border-color:var(--winter);}
  .mm-season .t{font-weight:800;font-size:1.15em;display:flex;align-items:center;gap:8px;}
  .mm-season.s春 .t{color:#3a7a3f;} .mm-season.s夏 .t{color:#256b46;}
  .mm-season.s秋 .t{color:#a9741a;} .mm-season.s冬 .t{color:#4c6b7c;}
  .mm-season .d{margin-top:8px;font-size:.95em;color:var(--ink);}
  .mm-season .blank{color:var(--muted);font-style:normal;opacity:.6;}
  /* ============ 反思輸入 ============ */
  .frame-box{background:var(--panel-soft);border:2px dashed var(--accent);border-radius:14px;padding:14px 18px;margin:16px 0;font-size:1.1em;font-weight:700;color:var(--accent-dark);}
  textarea.reflect{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:1.05em;line-height:1.8;color:var(--ink);resize:vertical;background:var(--panel);}
  textarea.reflect:focus{outline:none;border-color:var(--accent);}
  /* ============ 完成慶祝 ============ */
  .celebrate{text-align:center;}
  .celebrate .big{font-size:3.4em;}
  .celebrate h1{color:var(--accent-dark);font-size:1.7em;}
  .stars-row{display:flex;justify-content:center;gap:10px;margin:16px 0;}
  .stars-row .s{font-size:2.2em;}
  .summary{text-align:left;background:var(--panel-soft);border-radius:16px;padding:18px 22px;margin:18px 0;}
  .summary li{margin:6px 0;}
  /* ============ 休息一下（自我調節） ============ */
  .break-screen{text-align:center;padding:20px 0;}
  .breath{width:150px;height:150px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--accent);
    margin:26px auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-dark);font-size:1.05em;
    animation:breathe 8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(.72);}50%{transform:scale(1);}}
  /* ============ 頁尾品牌 ============ */
  footer{text-align:center;color:var(--muted);font-size:.78em;padding:26px 16px 40px;}
  footer .fb{display:inline-flex;align-items:center;gap:8px;opacity:.8;}
  footer .badge{width:22px;height:22px;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  @media(max-width:520px){
    .mm-grid{grid-template-columns:1fr;}
    .topbar .title{display:none;}
  }
  body.big1{--fs:1.12;} body.big2{--fs:1.28;}
</style>

/* ---------- 語音朗讀（離線 Web Speech，不支援時靜默） ---------- */
let voiceTW = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voiceTW = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang))
         || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text,btn){
  if(!state.audio || !window.speechSynthesis){return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="zh-TW"; u.rate=0.86; u.pitch=1.02;
  if(voiceTW) u.voice=voiceTW;
  if(btn){
    btn.classList.add("speaking");
    u.onend=u.onerror=()=>btn.classList.remove("speaking");
  }
  speechSynthesis.speak(u);
}
function stopSpeak(){ if(window.speechSynthesis) speechSynthesis.cancel(); }
/* 產生可安全放進「雙引號 onclick 屬性」的朗讀呼叫字串
   （用 &quot; 當字串界定符，避免雙引號截斷屬性） */
function ttsCall(s){
  var js=JSON.stringify(String(s));
  return "speak("+js.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+",this)";
}

/* ---------- 頂部進度星 ---------- */
function renderProg(){
  progEl.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dot"+(state.stars[i]?" done":"")+(state.view==="level"&&state.li===i?" current":"");
    d.textContent=state.stars[i]?"★":(i+1);
    progEl.appendChild(d);
  }
}

/* =====================================================================
   啟動一個關卡：展開步驟
   ===================================================================== */
function buildSteps(li){
  const steps=[{type:"intro"}];
  if(li===0){
    PASSAGES.forEach((p,idx)=>{
      steps.push({type:"read",data:p});
      if(p.check) steps.push({type:"check",data:p.check,tag:"想一想"});
    });
  }else if(li===1){
    ZI.forEach((z,idx)=>steps.push({type:"zi",data:z,idx}));
    steps.push({type:"wordintro"});
    WORDQ.forEach(q=>steps.push({type:"wordq",data:q}));
  }else if(li===2){
    SEASONS.forEach(s=>steps.push({type:"season",data:s}));
    steps.push({type:"mindmap"});
  }else if(li===3){
    PIRLS.forEach(p=>steps.push({type:"pirls",data:p}));
  }
  steps.push({type:"complete"});
  return steps;
}
function startLevel(li){
  state.li=li; state.steps=buildSteps(li); state.si=0; state.view="level";
  renderStep();
}

/* =====================================================================
   關卡步驟渲染
   ===================================================================== */
function stepShell(inner,opts={}){
  // opts: showBar(bool), next(fn label), prevOk(bool), nextLabel, nextDisabled
  renderProg();
  const lv=LEVELS[state.li];
  // 進度條僅計算「內容步驟」（去掉 intro 與 complete）
  const contentSteps = state.steps.length-2;
  const contentIdx = Math.min(Math.max(state.si-1,0),contentSteps-1);
  let bar="";
  if(opts.showBar!==false && state.si>0 && state.si<state.steps.length-1){
    let segs="";
    for(let k=0;k<contentSteps;k++){
      segs+=`<div class="seg ${k<contentIdx?'on':(k===contentIdx?'cur':'')}"></div>`;
    }
    bar=`<div class="step-count">第 ${contentIdx+1} 步　共 ${contentSteps} 步</div><div class="step-bar">${segs}</div>`;
  }
  app.innerHTML=`
    <div class="card">
      <div class="level-head">
        <span class="chip">${lv.ic} 關卡 ${state.li+1}　${lv.name}</span>
      </div>
      ${bar}
      ${inner}
    </div>`;
}
function goNext(){ state.si++; renderStep(); }
function goPrev(){ if(state.si>0){state.si--; renderStep();} }

function renderStep(){
  stopSpeak();
  const st=state.steps[state.si];
  if(!st){ renderHome(); return; }
  const T=st.type;
  if(T==="intro") return renderIntro();
  if(T==="read") return renderRead(st.data);
  if(T==="check") return renderChoice(st.data,{tag:st.tag,micro:true});
  if(T==="zi") return renderZi(st.data,st.idx);
  if(T==="wordintro") return renderWordIntro();
  if(T==="wordq") return renderChoice(st.data,{explain:st.data.explain});
  if(T==="season") return renderSeason(st.data);
  if(T==="mindmap") return renderMindmap();
  if(T==="pirls") return renderPirls(st.data);
  if(T==="complete") return renderComplete();
}

/* ---- 課文閱讀卡 ---- */
function renderRead(p){
  const seasonCls = p.season? "season-"+p.season : "season-none";
  // 生詞可點：以標記包起
  let html=p.text;
  (p.terms||[]).forEach(t=>{
    html=html.split(t).join(`<span class="term" onclick="showTerm('${t}',this)">${t}</span>`);
  });
  const isLast = state.si===state.steps.length-2; // complete 前
  stepShell(`
    <div class="read-badge ${seasonCls}">${p.ic}　${p.season?("這是"+p.season+"天"):p.label}</div>
    <div class="passage" id="passage">${html}</div>
    <div id="termPop" class="term-pop"></div>
    <div class="read-tools">
      <button class="tts" onclick="${ttsCall(p.text)}">🔊 聽這一段</button>
    </div>
    <div class="hint-line">💡 點【綠色】的語詞，可以看它的意思。讀完了就按下面的按鈕。</div>
    <div class="btn-row">
      <button class="btn ghost" onclick="goPrev()">◀ 上一步</button>
      <div class="spacer"></div>
      <button class="btn" onclick="goNext()">我讀完了　▶</button>
    </div>`);
}
function showTerm(t,el){
  const pop=document.getElementById("termPop");
  if(!pop) return;
  pop.innerHTML=`<span class="w">${t}</span>　<button class="tts" style="padding:6px 12px;font-size:.8em" onclick="${ttsCall(t+"。"+(GLOSS[t]||''))}">🔊 聽</button><div style="margin-top:8px">${GLOSS[t]||""}</div>`;
  pop.classList.add("show");
}

/* ---- 單選題（micro 檢核 或 語詞題 或 PIRLS 共用核心） ---- */
function renderChoice(data,opt={}){
  opt=opt||{};
  const keys=["A","B","C","D"];
  const optsHtml=data.options.map((o,i)=>
    `<button class="opt" id="opt${i}" onclick="answerChoice(${i},${data.answer},this,${JSON.stringify(opt.explain||"").replace(/"/g,'&quot;')||'""'})">
       <span class="key">${keys[i]}</span><span>${o}</span></button>`).join("");
  const tag = opt.tag? `<div class="read-badge season-秋" style="margin-bottom:10px">🤔 ${opt.tag}</div>`:"";
  stepShell(`
    ${tag}
    <div class="q-text">${data.q}　<button class="tts" style="padding:6px 12px;font-size:.7em;vertical-align:middle" onclick="${ttsCall(data.q)}">🔊</button></div>
    <div class="q-options">${optsHtml}</div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="goPrev()">◀ 上一步</button>
      <div class="spacer"></div>
      <button class="btn" id="nextBtn" onclick="goNext()" disabled>下一題　▶</button>
    </div>`);
}
function answerChoice(chosen,answer,el,explain){
  const fb=document.getElementById("fb");
  const nextBtn=document.getElementById("nextBtn");
  if(chosen===answer){
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    fb.className="feedback good show";
    fb.innerHTML=`✅ 答對了，很棒！${explain?("<br>"+explain):""}`;
    speak("答對了，很棒！"+(explain||""));
    if(nextBtn) nextBtn.disabled=false;
  }else{
    el.classList.add("wrong"); el.disabled=true;
    fb.className="feedback try show";
    fb.innerHTML=`🌟 沒關係，再想想看，選選看別的答案。`;
    speak("沒關係，再試一次看看。");
  }
}

  stepShell(`
    <div class="zi-card">
      <div class="step-count" style="text-align:center">生字　第 ${idx+1} ／ ${ZI.length} 個</div>
      <div class="zi-writer-wrap">
        <div class="zi-tian"><span class="cross-h"></span><span class="cross-v"></span><div id="ziWriter"></div></div>
        <div id="ziQuizMsg" class="zi-quizmsg"></div>
        <div id="ziCtrl" class="zi-ctrl">
          <button class="btn2" onclick="ziPlay()">✍️ 看筆順</button>
          <button class="btn2" onclick="ziQuiz()">🖊️ 換我描</button>

        </div>

        <span class="m">總共　<b>${z.total}</b> 畫</span>
      </div>
      <div class="zi-word">語詞：<span class="hl">${z.word}</span></div>
      <div style="margin-top:16px"><button class="tts" onclick="${ttsCall(listen)}">🔊 聽這個字</button></div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="goPrev()">◀ 上一個</button>
      <div class="spacer"></div>
      <button class="btn" onclick="goNext()">${idx===ZI.length-1?"生字看完了　▶":"下一個字　▶"}</button>
    </div>`);

}
/* ---- 生字筆順動畫（HanziWriter，資料已內嵌、離線可用） ---- */
let curWriter=null;
function mountHanzi(ch){
  curWriter=null;
  const el=document.getElementById("ziWriter");
  const ctrl=document.getElementById("ziCtrl");
  const hasLib=(typeof HanziWriter!=="undefined");
  const hasData=(window.HANZI_DATA && HANZI_DATA[ch]);
  if(!el){ return; }
  if(!hasLib || !hasData){
    el.innerHTML='<div class="zi-fallback">'+ch+'</div>';
    if(ctrl) ctrl.style.display="none";
    return;
  }
  if(ctrl) ctrl.style.display="flex";
  el.innerHTML="";
  try{
    curWriter=HanziWriter.create(el,ch,{
      width:200,height:200,padding:6,
      showCharacter:true,showOutline:true,
      strokeAnimationSpeed:0.7,delayBetweenStrokes:340,
      strokeColor:"#33352e",radicalColor:"#3f9d7c",outlineColor:"#d8d2c0",
      drawingColor:"#2f7d62",drawingWidth:24,highlightColor:"#8fd11e",
      charDataLoader:function(c,onComplete){onComplete(HANZI_DATA[c]);}
    });
  }catch(e){
    el.innerHTML='<div class="zi-fallback">'+ch+'</div>';
    if(ctrl) ctrl.style.display="none";
  }
}
function ziMsg(t){ const m=document.getElementById("ziQuizMsg"); if(m) m.textContent=t||""; }
function ziPlay(){ if(!curWriter) return; ziMsg("看好每一筆的方向喔。"); curWriter.showCharacter(); curWriter.animateCharacter(); }
function ziReset(){ if(!curWriter) return; ziMsg(""); curWriter.showCharacter(); curWriter.animateCharacter(); }
function ziQuiz(){
  if(!curWriter) return;
  ziMsg("用手指或滑鼠，順著筆順描描看。");
  curWriter.quiz({
    onComplete:function(){ ziMsg("✅ 太棒了，你把這個字描完了！"); speak("太棒了，你把這個字寫完了！"); },
    onMistake:function(){ ziMsg("沒關係，再順著筆畫描一次。"); }
  });
}
function renderWordIntro(){
  stepShell(`
    <div style="text-align:center;padding:10px 0">

}

/* ---- PIRLS 提問 ---- */
function renderPirls(p){
  const keys=["A","B","C"];
  const optsHtml=p.options.map((o,i)=>
    `<button class="opt" id="opt${i}" onclick="answerPirls(${i},${p.answer},this,${JSON.stringify(p.explain).replace(/"/g,'&quot;')},${p.reflect?"true":"false"})">
       <span class="key">${keys[i]}</span><span>${o}</span></button>`).join("");
  const reflectBox = p.reflect? `
     <div id="reflectArea" style="display:none">
       <div class="frame-box">✍️ 換你說說看：<br>${p.reflect}
         <button class="tts" style="margin-top:8px;padding:6px 12px;font-size:.78em" onclick="speak('${p.reflect.replace(/'/g,'')}',this)">🔊 聽句型</button>
       </div>
       <textarea class="reflect" placeholder="在這裡打上你的想法（也可以口頭說給老師聽）"></textarea>
     </div>`:"";
  stepShell(`
    <div class="read-badge season-秋" style="margin-bottom:10px">🧠 ${p.tag}　<span style="font-weight:400;opacity:.8">（${p.sub}）</span></div>
    <div class="q-text">${p.q}　<button class="tts" style="padding:6px 12px;font-size:.7em;vertical-align:middle" onclick="${ttsCall(p.q)}">🔊</button></div>
    <div class="q-options">${optsHtml}</div>
    <div class="feedback" id="fb"></div>
    ${reflectBox}
    <div class="btn-row">
      <button class="btn ghost" onclick="goPrev()">◀ 上一步</button>
      <div class="spacer"></div>
      <button class="btn" id="nextBtn" onclick="goNext()" disabled>${p.reflect?"完成　▶":"下一題　▶"}</button>
    </div>`);
}
function answerPirls(chosen,answer,el,explain,hasReflect){
  const fb=document.getElementById("fb");
  const nextBtn=document.getElementById("nextBtn");
  if(chosen===answer){
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    fb.className="feedback good show";
    fb.innerHTML=`✅ 答對了！${explain?("<br>"+explain):""}`;
    speak("答對了！"+(explain||""));
    if(nextBtn) nextBtn.disabled=false;
    if(hasReflect){ const r=document.getElementById("reflectArea"); if(r) r.style.display="block"; }
  }else{
    el.classList.add("wrong"); el.disabled=true;
    fb.className="feedback try show";
    fb.innerHTML=`🌟 再回去課文看看，然後選選看別的答案。`;
    speak("再試一次看看。");
  }
}

/* ---- 關卡完成 ---- */
function renderComplete(){
  state.stars[state.li]=true;
  renderProg();
  const lv=LEVELS[state.li];
  const nextLi=firstUnfinished();
  const allDone=nextLi>=4;
  stepShell(`
    <div class="celebrate">
      <div class="big">🎉</div>
      <h1>關卡 ${state.li+1}　${lv.name}　完成！</h1>
      <div class="stars-row"><div class="s">${state.stars.map(s=>s?"⭐":"☆").join("</div><div class=\"s\">")}</div></div>
      <p style="font-size:1.1em">你得到一顆星星 ⭐，做得很好！</p>
      <div style="margin-top:10px"><button class="tts" onclick="speak('關卡完成，你得到一顆星星，做得很好！',this)">🔊 聽鼓勵</button></div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="renderHome()">🏠 回地圖</button>

}

function resetAll(){ state.stars=[false,false,false,false]; renderHome(); }

/* =====================================================================
   工具列
   ===================================================================== */
document.getElementById("btnFont").onclick=()=>{
  state.fontLevel=(state.fontLevel+1)%3;
  document.body.classList.remove("big1","big2");
  if(state.fontLevel===1) document.body.classList.add("big1");
  if(state.fontLevel===2) document.body.classList.add("big2");
};
document.getElementById("btnAudio").onclick=(e)=>{
  state.audio=!state.audio;
  e.currentTarget.classList.toggle("off",!state.audio);
  if(!state.audio) stopSpeak();
};
document.getElementById("btnHome").onclick=()=>{ if(confirmLeave()) renderHome(); };
function confirmLeave(){ return true; }
document.getElementById("btnBreak").onclick=()=>{
  if(state.view==="break") return;
  state.prevView={li:state.li,si:state.si,view:state.view};
  state.view="break"; stopSpeak();
  app.innerHTML=`
    <div class="card break-screen">
      <div style="font-size:2.6em">🌿</div>
      <h2 style="color:var(--accent-dark)">休息一下</h2>
      <p>跟著圓圈慢慢呼吸。<br>圓圈變大時吸氣，變小時吐氣。</p>
      <div class="breath" id="breathBall">吸氣　吐氣</div>
      <p style="color:var(--muted)">準備好了，就按下面的按鈕回來。</p>
      <button class="btn" onclick="backFromBreak()">我休息好了　▶</button>
    </div>`;
};
function backFromBreak(){
  const p=state.prevView;
  if(p && p.view==="level"){ state.view="level"; state.li=p.li; state.si=p.si; renderStep(); }
  else renderHome();
}

/* ---------- 啟動 ---------- */
renderHome();
